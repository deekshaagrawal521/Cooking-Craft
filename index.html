<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookCraft</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="video.css">
</head>
<script src="//code.tidio.co/q7mcsecquvp6wonovlzb7huxhx819fjy.js" async></script>
<body>
    <header>
        <h1>CookCraft</h1>
    </header>
    
    <nav>
        <a href="index.html"><button class="nav-btn">Home</button></a>
        <a href="video.html"><button class="nav-btn">Recipe Video</button></a>
    </nav>
    
    <main>
        <!-- Recipe Page -->
        <section id="search-section">
            <h2>Find Recipes by Ingredients</h2>
            <form id="search-form">
                <input type="text" id="ingredients" placeholder="Enter ingredients (comma separated)" required>
                <button type="button" id="search-btn">Search Recipes</button>
            </form>
        </section>

        <section id="recipe-results">
            <h2>Recipe Results</h2>
            <div id="recipes-container"></div>
        </section>

        <section id="recipe-detail">
            <h2>Recipe Details</h2>
            <div id="recipe-detail-container"></div>
        </section>

        <section id="shopping-list">
            <h2>Your Shopping List</h2>
            <ul id="shopping-list-container"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Recipe Finder App</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
